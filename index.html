<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1efeb">
  <meta name="description" content="Zekai Wei — photography, explored through a moving canvas.">
  <title>Zekai Wei — Photography</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body>
<main id="camera-portfolio">

<div class="viewport">
 <div class="track">
  <button class="home-logo" type="button" aria-label="Home Canvas" title="Home Canvas"><span aria-hidden="true">ZW</span></button>
  <button class="work-logo" type="button" aria-label="Open Work Canvas" disabled>Work</button>
  <section class="page home" aria-label="Home Canvas">
   <header><span>Zekai Wei</span></header>
   <button class="camera" type="button" aria-label="Open Camera Canvas" disabled><img class="body" src="./assets/camera-front.webp" width="2048" height="1250" alt="Black compact camera" fetchpriority="high"><canvas class="cover" width="346" height="284" aria-hidden="true"></canvas></button>
   <button class="entry" disabled>Photography</button>
   <button class="work-entry" disabled>Work</button>
  </section>
  <section class="page photos" aria-label="Camera Canvas" inert>
   <header><button class="back">‹ Back</button><span class="page-brand">Photography</span></header>
   <div class="gallery"><h1>Photography</h1><p class="scroll-cue">Scroll to explore</p><canvas class="sample" width="274" height="314" role="img" aria-label="Sample architectural photograph from the reference"></canvas><div class="pair"><canvas width="132" height="178" role="img" aria-label="Sample street photograph"></canvas><canvas width="132" height="178" role="img" aria-label="Sample staircase photograph"></canvas></div><p class="sample-label">Study images · Gallery layout preview</p></div>
  </section>
  <section class="page work" aria-label="Work Canvas" inert>
   <header><button class="work-back" type="button">‹ Home</button></header>
   <div class="work-content"><h1>Work</h1><p>A space for projects, ideas, and things in progress.</p><div class="project-placeholder">Projects coming soon</div></div>
  </section>
 </div>
 <span class="status" role="status" aria-live="polite">Loading camera</span>
</div>

</main>
</body>
</html>
